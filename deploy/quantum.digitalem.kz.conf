# Положить в /etc/nginx/conf.d/quantum.digitalem.kz.conf
# HTTPS и редирект добавит certbot (--nginx), как у остальных сайтов.

# Сайт → контейнер quantum, порт 4321
server {
    listen 80;
    server_name quantum.digitalem.kz;

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Админка Directus → контейнер quantum, порт 8055
server {
    listen 80;
    server_name cms.quantum.digitalem.kz;
    client_max_body_size 200M;   # загрузка видео и фото

    location / {
        proxy_pass http://127.0.0.1:8055;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
